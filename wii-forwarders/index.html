<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="cmyksoda's Wii forwarder channels, on a Wii Menu that runs in your browser." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <title>Wii Menu · cmyksoda's forwarder channels</title>
    <script>
      // ?debug shows what the page is doing, for phones without a console. It starts before the module so it sees that fail too.
      if (/[?&]debug\b/.test(location.search)) {
        const box = document.createElement('pre');
        box.style.cssText = 'position:fixed;inset:0 0 auto 0;z-index:9;margin:0;padding:8px;font:12px/1.4 monospace;color:#7f7;background:#000c;white-space:pre-wrap;pointer-events:none';
        const status = document.createTextNode('');
        const log = document.createTextNode('page script ran\n');
        box.append(status, '\n', log);
        addEventListener('DOMContentLoaded', () => document.body.append(box));
        addEventListener('error', (e) => (log.data += `error: ${e.message || e.target?.src || e.target?.href || e.type}\n`), true);
        addEventListener('unhandledrejection', (e) => (log.data += `rejection: ${e.reason?.stack || e.reason}\n`));
        window.__debug = { log: (line) => (log.data += `${line}\n`), status: (text) => (status.data = text), append: (node) => box.append(node) };
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; cursor: none; touch-action: none; }
      /* A phone's address bar covers the bottom of 100vh, which would push the rotate screen off center. */
      @media (orientation: portrait) { canvas { height: 100dvh; } }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .fallback { position: fixed; inset: 0; margin: 0; display: grid; place-content: center; gap: 0.75rem; padding: 2rem; color: #e8e8ee; font: 1rem/1.6 system-ui, sans-serif; text-align: center; }
      .fallback a { color: #6fd6ff; }
    </style>
  </head>
  <body>
    <canvas id="screen" aria-label="Wii Menu with cmyksoda's forwarder channels"></canvas>
    <nav class="sr-only" aria-label="forwarder channels" id="channel-links"></nav>
    <p class="sr-only" id="notice" aria-live="polite"></p>
    <noscript>
      <p class="fallback">This Wii Menu needs JavaScript. My forwarder channels are all listed on
        <a href="https://github.com/cmyksoda/Wii-Forwarders">GitHub</a>.</p>
    </noscript>
    <script type="module" src="../src/wii-menu/main.ts"></script>
  </body>
</html>
